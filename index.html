<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bunny</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container-jogo" id="app">
    <!-- Cabeçalho com título Fairy Dust e controles -->
    <header class="cabecalho">
      <div class="titulo-area">
        <span class="icone-titulo" aria-hidden="true">🐰</span>
        <h1>Bunny</h1>
      </div>
      <div class="controles-topo">
        <button type="button" class="botao-modo" id="botao-modo" title="Alternar entre Pedidos e Modo Livre">
          🎲 Pedidos
        </button>
        <button type="button" class="botao-tema" id="botao-tema" aria-label="Alternar tema claro ou escuro">
          ☀️ / 🌙
        </button>
      </div>
    </header>

    <!-- Seletor dos cenários + Customização rápida -->
    <nav class="barra-navegacao" aria-label="Escolher cômodo ou estilo">
      <button type="button" class="aba ativa" id="aba-quarto" data-cenario="quarto">
        🛏️ Quarto
      </button>
      <button type="button" class="aba" id="aba-comida" data-cenario="comida">
        🍓 Comida
      </button>
      <button type="button" class="aba aba-estilo" id="botao-laco">
        🎀 Laço
      </button>
      <button type="button" class="aba aba-estilo" id="botao-decor">
        🌸 Estilo
      </button>
    </nav>

    <!-- Palco principal interativo -->
    <section class="palco-cenario cenario-quarto decor-rosa" id="palco" aria-live="polite">
      <!-- Overlay de luz apagada (quando clica no abajur ou coloca para dormir) -->
      <div class="filtro-noite escondido" id="filtro-noite"></div>

      <!-- Decoração Interativa do Quarto Cutecore -->
      <div class="decoracao-quarto" id="decoracao-quarto">
        <div class="luzinhas" id="luzinhas">✨ ⭐ ✨ ⭐ ✨</div>

        <!-- Estante de pelúcias clicável -->
        <button type="button" class="objeto-interativo estante-pelucias" id="obj-estante" title="Chacoalhar pelúcias">
          <div class="prateleira" id="prateleira-1">🧸 🐰 ☁️</div>
          <div class="prateleira" id="prateleira-2">🎀 🐱 🌸</div>
        </button>

        <!-- Abajur clicável para apagar/acender a luz -->
        <button type="button" class="objeto-interativo abajur-quarto" id="obj-abajur" title="Acender ou apagar abajur">
          🏮
        </button>

        <!-- Bolinha de lã clicável no chão -->
        <button type="button" class="objeto-interativo bolinha-la" id="obj-bola" title="Jogar bolinha de lã">
          🧶
        </button>

        <!-- Caminha de madeira clicável -->
        <button type="button" class="objeto-interativo caminha-madeira" id="obj-cama" title="Colocar Bunny na caminha">
          <div class="colchao-felpudo"></div>
        </button>

        <div class="tapete-rosa" id="tapete-quarto" aria-hidden="true"></div>
      </div>

      <!-- Decoração Interativa do Canto da Comida -->
      <div class="decoracao-comida escondido" id="decoracao-comida">
        <div class="grade-branca" aria-hidden="true"></div>

        <!-- Bebedouro e tigelas clicáveis -->
        <div class="bebedouro-tigelas">
          <button type="button" class="objeto-interativo item-tigela garrafinha-agua" id="obj-agua" title="Encher aguinha">
            💧
          </button>
          <button type="button" class="objeto-interativo item-tigela tigela-rosa" id="obj-tigela-comida" title="Servir comidinha na tigela">
            <span id="conteudo-tigela">🥣</span>
          </button>
          <div class="tigela-rosa" aria-hidden="true">🍓</div>
        </div>

        <div class="almofada-listrada" aria-hidden="true"></div>
      </div>

      <!-- Balão de pensamento do coelhinho -->
      <div class="balao-pedido" id="balao-pedido">
        <span class="icone-pedido" id="icone-pedido">🥕</span>
        <p id="texto-pedido">Oi! O que vamos fazer hoje?</p>
      </div>

      <!-- O Coelhinho Pretinho em Pixel Art -->
      <button type="button" class="coelhinho-botao" id="coelhinho" aria-label="Fazer carinho no coelhinho pretinho">
        <div class="coelhinho-corpo feliz" id="coelhinho-visual">
          <!-- Acessório (Lacinho/Florzinha na cabeça) -->
          <span class="acessorio-coelho escondido" id="acessorio-coelho" aria-hidden="true">🎀</span>

          <svg class="sprite-coelho" viewBox="0 0 32 24" shape-rendering="crispEdges" aria-hidden="true">
            <!-- Silhueta / Contorno externo contínuo -->
            <path fill="#130f17" d="
              M 4,2 h 3 v 1 h 1 v 2 h 1 v 4 h 2 v -6 h 1 v -1 h 3 v 1 h 1 v 2 h 1 v 5 h 4 v -2 h 1 v -1 h 4 v 1 h 1 v 1 h 1 v 4 h -1 v 1 h -1 v 5 h -1 v 1 h -1 v 1 h -22 v -1 h -2 v -2 h 1 v -1 h 1 v -3 h 1 v -2 h 1 v -2 h -1 v -6 h 1 Z
            "/>
            <!-- Pelagem preta principal -->
            <path fill="#27212d" d="
              M 4,3 h 3 v 7 h -3 Z
              M 12,3 h 3 v 7 h -3 Z
              M 5,10 h 12 v 1 h 3 v 1 h 4 v 1 h 1 v 6 h -1 v 1 h -18 v -1 h -1 v -3 h -1 v -3 h 1 Z
              M 2,18 h 3 v 2 h -3 Z
              M 22,8 h 4 v 1 h 1 v 4 h -1 v 1 h -4 v -1 h -1 v -4 h 1 Z
            "/>
            <!-- Volume / Brilho suave nas costas, cabeça e rabinho -->
            <path fill="#383042" d="
              M 7,10 h 8 v 1 h 4 v 1 h 2 v 2 h -12 v -1 h -2 Z
              M 22,8 h 3 v 1 h 1 v 3 h -1 v 1 h -3 v -1 h -1 v -3 h 1 Z
              M 4,3 h 1 v 2 h -1 Z
              M 12,3 h 1 v 2 h -1 Z
            "/>
            <!-- Sombra da base e da patinha -->
            <path fill="#1b1620" d="
              M 5,19 h 19 v 1 h -19 Z
              M 2,19 h 3 v 1 h -3 Z
              M 12,17 h 3 v 1 h -3 Z
            "/>
            <!-- Interior rosa das orelhas -->
            <path fill="#f7a8c9" d="
              M 5,4 h 1 v 6 h -1 Z
              M 13,4 h 1 v 6 h -1 Z
            "/>
            <path fill="#ffd6e8" d="
              M 5,4 h 1 v 3 h -1 Z
              M 13,4 h 1 v 3 h -1 Z
            "/>
            <!-- Olhos fechadinhos fofos -->
            <path fill="#9d89ab" d="
              M 5,14 h 2 v 1 h -2 Z
              M 10,14 h 2 v 1 h -2 Z
            "/>
            <!-- Bochechinhas rosadas -->
            <path fill="#f28cb6" opacity="0.65" d="
              M 4,15 h 1 v 1 h -1 Z
              M 12,15 h 1 v 1 h -1 Z
            "/>
            <!-- Focinho rosa -->
            <path fill="#ff8fbc" d="
              M 7,16 h 3 v 1 h -3 Z
              M 8,17 h 1 v 1 h -1 Z
            "/>
            <!-- Lagrimazinha (aparece quando está tristinho) -->
            <path class="lagrima-pixel" fill="#7dd3fc" d="
              M 6,15 h 1 v 2 h -1 Z
              M 11,15 h 1 v 2 h -1 Z
            "/>
          </svg>
        </div>
        <span class="efeito-flutuante" id="efeito-flutuante" aria-hidden="true">💖</span>
      </button>

      <!-- Sub-menu de escolha de comidinhas (abre ao clicar em Comidinha) -->
      <div class="menu-comidinhas escondido" id="menu-comidinhas" role="group" aria-label="Escolher comidinha">
        <button type="button" class="opcao-comida" data-comida="cenoura">🥕 Cenoura</button>
        <button type="button" class="opcao-comida" data-comida="morango">🍓 Morango</button>
        <button type="button" class="opcao-comida" data-comida="alface">🥬 Folhinha</button>
        <button type="button" class="opcao-comida" data-comida="biscoito">🍪 Biscoito</button>
      </div>

      <!-- Mensagem amigável de retorno -->
      <div class="mensagem-status" id="mensagem-status">
        Toque nos objetos do cenário ou nos botões abaixo!
      </div>
    </section>

    <!-- Botões de ações para cuidar do coelhinho -->
    <section class="painel-acoes" aria-label="Ações de cuidado">
      <button type="button" class="botao-acao" data-acao="comer">
        <span class="emoji-acao">🍓</span>
        <span>Comidinha</span>
      </button>
      <button type="button" class="botao-acao" data-acao="agua">
        <span class="emoji-acao">💧</span>
        <span>Aguinha</span>
      </button>
      <button type="button" class="botao-acao" data-acao="escovar">
        <span class="emoji-acao">🪮</span>
        <span>Escovar</span>
      </button>
      <button type="button" class="botao-acao" data-acao="brincar">
        <span class="emoji-acao">🧶</span>
        <span>Brincar</span>
      </button>
      <button type="button" class="botao-acao" data-acao="dormir">
        <span class="emoji-acao">🌙</span>
        <span>Dormir</span>
      </button>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
